# more acceleration, but slightly lower quality
pbar_rate: 10
trainer:
  check_val_every_n_epoch: 10

model:
  gaussian:
    init_args:
      optimization:
        optimizer: SelectiveAdam
  renderer: 
    class_path: internal.renderers.gsplat_v1_renderer.GSplatV1Renderer
    init_args:
      separate_sh: true
      precise_tile_intersect: true
      anti_aliased: false
  metric:
    init_args:
      fused_ssim: true
