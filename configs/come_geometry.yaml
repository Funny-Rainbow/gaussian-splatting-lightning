model:
  renderer:
    class_path: internal.renderers.gsplat_v1_renderer.GSplatV1Renderer
    init_args:
      separate_sh: true
      precise_tile_intersect: true
  metric:
    class_path: internal.metrics.come_geometry.ComeGeometryMetrics
    init_args:
      fused_ssim: true
      depth_normal_from_iter: 7000
      depth_normal_lambda: 0.005
      depth_normal_alpha_threshold: 0.3
      flatten_lambda: 0.0
      alpha_entropy_lambda: 0.0
      background_depth_from_iter: 15000
      background_depth_lambda: 0.01
      background_depth_key: hard_inverse_depth
      background_depth_dilate_pixels: 8
      background_depth_clamp_max: 1.0
  renderer_output_types:
    - rgb
    - alpha
    - exp_depth
    - normal
    - hard_inverse_depth
